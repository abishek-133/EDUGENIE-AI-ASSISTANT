<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGenie AI | Intelligent Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-border: #1f293d;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      --user-bg: #2563eb;
      --bot-bg: #162032;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Top Navigation */
    header {
      padding: 0.85rem 1.5rem;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px; background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700; color: #fff;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .brand-text h1 { font-size: 1.05rem; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .brand-text p { font-size: 0.75rem; color: var(--text-muted); }
    .badge {
      font-size: 0.7rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px;
      background: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Main Container (Centered Column) */
    main {
      flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 860px;
      margin: 0 auto; padding: 1.5rem 1rem; overflow: hidden;
    }

    #chat-box {
      flex: 1; overflow-y: auto; padding-right: 0.5rem; display: flex; flex-direction: column; gap: 1.5rem;
      scrollbar-width: thin; scrollbar-color: var(--surface-border) transparent;
    }
    #chat-box::-webkit-scrollbar { width: 6px; }
    #chat-box::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 10px; }

    /* Message Row */
    .msg-row { display: flex; gap: 0.85rem; width: 100%; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.user-row { justify-content: flex-end; }
    
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0; font-weight: 600;
    }
    .bot-avatar { background: var(--accent-gradient); color: #fff; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.25); }
    .user-avatar { background: #3b82f6; color: #fff; }

    .bubble {
      max-width: 80%; padding: 0.9rem 1.25rem; border-radius: 16px; font-size: 0.94rem; line-height: 1.65;
    }
    .user-row .bubble {
      background: var(--user-bg); color: #fff; border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    }
    .bot-row .bubble {
      background: var(--bot-bg); border: 1px solid var(--surface-border);
      border-bottom-left-radius: 4px; color: #e2e8f0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    /* Markdown Styling */
    .bubble p:not(:last-child) { margin-bottom: 0.65rem; }
    .bubble ul, .bubble ol { margin: 0.5rem 0 0.5rem 1.4rem; }
    .bubble li { margin-bottom: 0.35rem; }
    .bubble code {
      background: rgba(0, 0, 0, 0.4); padding: 0.2rem 0.4rem; border-radius: 6px; font-family: monospace; font-size: 0.85em; color: var(--accent);
    }
    .bubble pre {
      background: #090e17; padding: 0.85rem; border-radius: 8px; overflow-x: auto; margin: 0.75rem 0; border: 1px solid var(--surface-border);
    }
    .bubble pre code { background: transparent; padding: 0; color: #f1f5f9; }

    /* Suggested Chips */
    .suggestions {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem;
    }
    .chip {
      background: rgba(22, 32, 50, 0.8); border: 1px solid var(--surface-border); color: var(--text-muted);
      padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.05); }

    /* Input Footer */
    .input-wrapper {
      padding-top: 0.5rem; position: relative;
    }
    form {
      display: flex; align-items: center; background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 14px; padding: 0.4rem 0.5rem 0.4rem 1rem; box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      transition: border-color 0.2s;
    }
    form:focus-within { border-color: var(--accent); box-shadow: 0 8px 30px rgba(56, 189, 248, 0.15); }
    input {
      flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.95rem;
    }
    input::placeholder { color: #64748b; }
    button {
      background: var(--accent-gradient); color: #fff; border: none; border-radius: 10px;
      padding: 0.65rem 1.25rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }

    /* Typing Animation */
    .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.1); } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">✨</div>
      <div class="brand-text">
        <h1>EduGenie</h1>
        <p>Adaptive AI Learning Partner</p>
      </div>
    </div>
    <div class="badge">Gemini-Powered</div>
  </header>

  <main>
    <div id="chat-box">
      <div class="msg-row bot-row">
        <div class="avatar bot-avatar">EG</div>
        <div class="bubble">
          👋 <strong>Hello! I am EduGenie.</strong><br>
          What concept, exam topic, or problem can we explore together today?
        </div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="suggestions">
        <div class="chip" onclick="askChip('Explain Binary Search Trees in simple terms')">🌳 Binary Search Trees</div>
        <div class="chip" onclick="askChip('How does the TCP 3-way handshake work?')">🌐 TCP Handshake</div>
        <div class="chip" onclick="askChip('Give me 3 practice questions on Normal Distribution')">📊 Normal Distribution Quiz</div>
      </div>
      <form id="chat-form">
        <input type="text" id="user-input" placeholder="Ask a question or paste a problem..." autocomplete="off" required />
        <button type="submit">Ask <span>➔</span></button>
      </form>
    </div>
  </main>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const box = document.getElementById('chat-box');

    function appendMessage(sender, htmlContent) {
      const row = document.createElement('div');
      row.className = `msg-row ${sender}-row`;

      if (sender === 'bot') {
        row.innerHTML = `
          <div class="avatar bot-avatar">EG</div>
          <div class="bubble">${htmlContent}</div>
        `;
      } else {
        row.innerHTML = `
          <div class="bubble">${htmlContent}</div>
          <div class="avatar user-avatar">You</div>
        `;
      }
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
      return row.querySelector('.bubble');
    }

    function askChip(text) {
      input.value = text;
      form.dispatchEvent(new Event('submit'));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage('user', prompt);
      input.value = '';

      const loadingBubble = appendMessage('bot', `
        <div class="typing-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      `);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt })
        });
        const data = await res.json();
        loadingBubble.innerHTML = marked.parse(data.response || data.error || 'No reply.');
      } catch (err) {
        loadingBubble.textContent = 'Connection error. Check your server.';
      }
      box.scrollTop = box.scrollHeight;
    });
  </script>
</body>
</html>
