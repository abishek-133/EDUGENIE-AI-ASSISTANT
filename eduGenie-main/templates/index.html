<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EduGenie - AI Learning Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; }
    #chat-box { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 75%; padding: 0.8rem 1.2rem; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 2px; }
    .bot pre { background: #0b1120; padding: 0.5rem; border-radius: 6px; overflow-x: auto; margin: 0.5rem 0; }
    .bot code { font-family: monospace; font-size: 0.9em; }
    form { display: flex; gap: 0.5rem; padding: 1rem 1.5rem; background: #1e293b; border-top: 1px solid #334155; }
    input { flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 0.75rem 1.5rem; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <header>
    <h1>EduGenie AI Assistant</h1>
  </header>
  <div id="chat-box">
    <div class="msg bot">Hello! I am EduGenie. What concept or problem can I help you learn today?</div>
  </div>
  <form id="chat-form">
    <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off" required />
    <button type="submit">Ask</button>
  </form>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const box = document.getElementById('chat-box');

    function appendMessage(sender, text, isMarkdown = false) {
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      if (isMarkdown) {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage('user', prompt);
      input.value = '';

      const loadingDiv = appendMessage('bot', 'EduGenie is thinking...');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt })
        });
        const data = await res.json();
        loadingDiv.innerHTML = marked.parse(data.response || data.error || 'No response received.');
      } catch (err) {
        loadingDiv.textContent = 'Error connecting to server.';
      }
      box.scrollTop = box.scrollHeight;
    });
  </script>
</body>
</html>
